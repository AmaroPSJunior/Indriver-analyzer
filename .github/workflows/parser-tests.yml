name: Parser tests

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test map
        run: node scripts/test-map.cjs
      - name: Compile and run Android unit tests
        run: bash ./gradlew compileDebugKotlin testDebugUnitTest --no-daemon
