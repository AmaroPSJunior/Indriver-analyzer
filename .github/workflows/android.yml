name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-test-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip gradle-8.5-bin.zip
          echo "PATH=$GITHUB_WORKSPACE/gradle-8.5/bin:$PATH" >> "$GITHUB_ENV"

      - name: Restore persistent test signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Configure ANDROID_TEST_KEYSTORE_BASE64 with the permanent test keystore. A new key will never be generated automatically."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -exportcert -keystore debug.keystore -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/test-signer.der"
          openssl dgst -sha256 "$RUNNER_TEMP/test-signer.der"

      - name: Set increasing version code
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" -ge 100 ]; then
            echo "::error::Start a new workflow run instead of retrying this run."
            exit 1
          fi
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if [ "$BUILD_NUMBER" -gt 2100000000 ]; then
            echo "::error::Android versionCode limit exceeded."
            exit 1
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Build with Gradle
        run: gradle testDebugUnitTest assembleDebug -PbuildNumber="$BUILD_NUMBER"

      - name: Verify APK signature and identity
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          cat "$RUNNER_TEMP/apk-signature.txt"
          EXPECTED=$(openssl dgst -sha256 "$RUNNER_TEMP/test-signer.der" | awk '{print $NF}')
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt")
          test "$EXPECTED" = "$ACTUAL"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -q "^package: name='com.uberanalyzer' versionCode='$BUILD_NUMBER'" "$RUNNER_TEMP/apk-badging.txt"

      - name: Renomear arquivo APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/app-v1.0.$BUILD_NUMBER.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-v1.0.${{ env.BUILD_NUMBER }}
          path: app/build/outputs/apk/debug/app-v1.0.${{ env.BUILD_NUMBER }}.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ env.BUILD_NUMBER }}"
          name: "Release v1.0.${{ env.BUILD_NUMBER }}"
          body: |
            APK de testes com assinatura persistente. Instale sobre a versão anterior, sem desinstalar.
            Dados e permissões existentes normalmente são preservados em atualizações compatíveis.
            Se a versão antiga foi assinada com outra chave, será necessária uma migração inicial.
          files: app/build/outputs/apk/debug/app-v1.0.${{ env.BUILD_NUMBER }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.repo_token_auto_releases }}

      - name: Remove signing material from runner
        if: always()
        run: rm -f debug.keystore "$RUNNER_TEMP/test-signer.der"
