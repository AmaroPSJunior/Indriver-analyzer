name: Android PR checks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Test map
        run: node scripts/test-map.cjs
      - name: Compile and test Android without signing keys
        run: gradle compileDebugKotlin testDebugUnitTest --no-daemon
