name: Android PR checks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle (the repository wrapper is not used)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.5/bin" >> "$GITHUB_ENV"
      - name: Test map
        run: node scripts/test-map.cjs
      - name: Compile and test Android without signing keys
        run: gradle compileDebugKotlin testDebugUnitTest --no-daemon
